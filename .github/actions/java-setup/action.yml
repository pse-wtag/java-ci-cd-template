name: Setup Java and Maven Environment
description: Installs the requested JDK version, configures Maven caching, and sets MAVEN_OPTS

inputs:
  java-version:
    description: The JDK version to install
    required: false
    default: '25'
  cache-type:
    description: The dependency manager to cache (maven)
    required: false
    default: 'maven'
  maven-opts:
    description: JVM options for Maven
    required: false
    default: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      id: setup-java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: ${{ inputs.cache-type }}

    - name: Show cache status
      shell: bash
      env:
        CACHE_TYPE: ${{ inputs.cache-type }}
        CACHE_HIT: ${{ steps.setup-java.outputs.cache-hit }}
      run: |
        echo "Cache type: $CACHE_TYPE"
        echo "Cache hit: $CACHE_HIT"

    - name: Inject Global MAVEN_OPTS
      shell: bash
      env:
        MAVEN_OPTS_INPUT: ${{ inputs.maven-opts }}
      run: | # zizmor: ignore[github-env]
        if printf '%s' "$MAVEN_OPTS_INPUT" | grep -q $'[\n\r]'; then
          echo "::error::maven-opts must be a single line"
          exit 1
        fi
        # Multi-line values are rejected above and the expansion is quoted, so this
        # write cannot inject additional variables.
        printf 'MAVEN_OPTS=%s\n' "$MAVEN_OPTS_INPUT" >> "$GITHUB_ENV"
