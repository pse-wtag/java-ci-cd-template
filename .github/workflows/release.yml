name: Release

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      egress-policy:
        required: false
        type: string
        default: "audit"
      docker-allowed-endpoints:
        required: false
        type: string
        default: ""
      spring-boot-args:
        required: false
        type: string
        default: ""
      signer-identity-regexp:
        description: >
          Regexp the published image's keyless Cosign signature must match
          before the GitOps manifest is promoted. Empty defaults to any
          workflow under the current repository owner.
        required: false
        type: string
        default: ""
    secrets:
      CR_PAT:
        required: false

jobs:
  tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/tag.yml
    permissions:
      contents: write

  docker-publish:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/docker.yml
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.docker-allowed-endpoints }}
      spring-boot-args: ${{ inputs.spring-boot-args }}

  verify-image:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.docker-allowed-endpoints }}

      - name: Login to Github Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify image signature (keyless)
        env:
          REPO_NAME: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHORT_SHA: ${{ github.sha }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)
          IMAGE="ghcr.io/${REPO_LC}:main-${SHORT_SHA}"

          if [ -z "$IDENTITY_REGEXP" ]; then
            IDENTITY_REGEXP="^https://github.com/${OWNER}/"
          fi

          echo "Verifying signature for $IMAGE (identity ~ ${IDENTITY_REGEXP})"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
