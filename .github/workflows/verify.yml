name: Verify

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      egress-policy:
        required: false
        type: string
        default: "block"
      test-allowed-endpoints:
        required: false
        type: string
        default: >
          github.com:443
          repo.maven.apache.org:443
          repo1.maven.org:443
          api.github.com:443
          repo.spring.io:443
          repository.jboss.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
      security-allowed-endpoints:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: >
          api.github.com:443
          github.com:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          repo.maven.apache.org:443
          repo.spring.io:443
          repository.jboss.org:443
          uploads.github.com:443
          objects.githubusercontent.com:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
          check.trivy.dev:443
          get.anchore.io:443
          timestamp.sigstore.dev:443
          mirror.gcr.io:443
    secrets:
      extra-secrets:
        required: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.test-allowed-endpoints }}

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      checks: write
      contents: read
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.test-allowed-endpoints }}

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      checks: write
      contents: read
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.test-allowed-endpoints }}
      test-args: ${{ inputs.test-args }}
    secrets:
      extra-secrets: ${{ secrets.extra-secrets }}

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.security-allowed-endpoints }}
